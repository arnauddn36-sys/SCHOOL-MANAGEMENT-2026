<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription — School Management</title>

    <!-- FontAwesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body class="enveloppe-connexion">

    <main class="conteneur-connexion">

        <!-- EN-TÊTE AU-DESSUS DE LA CARTE D'INSCRIPTION -->
        <header class="en-tete-accueil">
            <h1 class="titre-accueil">BIENVENUE DANS VOTRE ESPACE DE GESTION SCOLAIRE</h1>
            <p class="sous-titre-accueil">Créez votre compte élève pour accéder à vos notes et absences.</p>

            <div class="etiquettes-accueil">
                <span class="etiquette"><i class="fa-solid fa-user-shield"></i> Administration</span>
                <span class="puce-etiquette">•</span>
                <span class="etiquette"><i class="fa-solid fa-chalkboard-user"></i> Enseignants</span>
                <span class="puce-etiquette">•</span>
                <span class="etiquette"><i class="fa-solid fa-graduation-cap"></i> Élèves</span>
                <span class="puce-etiquette">•</span>
                <span class="etiquette"><i class="fa-solid fa-file-pen"></i> Notes</span>
                <span class="puce-etiquette">•</span>
                <span class="etiquette"><i class="fa-solid fa-chart-line"></i> Statistiques</span>
            </div>
        </header>

        <!-- CARTE D'INSCRIPTION -->
        <section class="carte-connexion">

            <div class="avatar-utilisateur">
                <i class="fa-solid fa-user-graduate"></i>
            </div>

            <div class="en-tete-marque">
                <h1>SCHOOL MANAGEMENT</h1>
                <h2>Créer votre compte élève</h2>
            </div>

            <form id="formulaireInscription" class="formulaire-neon" autocomplete="off">

                <div class="champ-saisie">
                    <label for="nom" class="masque-visuellement">Votre nom</label>
                    <i class="fa-regular fa-id-card"></i>
                    <input type="text" id="nom" name="nom" placeholder="Votre nom" required autocomplete="off">
                </div>

                <div class="champ-saisie">
                    <label for="prenom" class="masque-visuellement">Votre prénom</label>
                    <i class="fa-regular fa-user"></i>
                    <input type="text" id="prenom" name="prenom" placeholder="Votre prénom" required autocomplete="off">
                </div>

                <div class="champ-saisie">
                    <label for="email" class="masque-visuellement">Votre email Gmail</label>
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" id="email" name="email" placeholder="votreadresse@gmail.com" required autocomplete="email">
                </div>

                <div class="champ-saisie">
                    <label for="matricule" class="masque-visuellement">Votre matricule</label>
                    <i class="fa-solid fa-id-badge"></i>
                    <input type="text" id="matricule" name="matricule" placeholder="Votre matricule (ex: MAT-2026-001)" required autocomplete="off">
                </div>

                <div class="champ-saisie">
                    <label for="age" class="masque-visuellement">Votre âge</label>
                    <i class="fa-solid fa-cake-candles"></i>
                    <input type="number" id="age" name="age" placeholder="Votre âge" required min="3" max="30" autocomplete="off">
                </div>

                <div class="champ-saisie">
                    <label for="classe" class="masque-visuellement">Votre classe</label>
                    <i class="fa-solid fa-chalkboard"></i>
                    <input type="text" id="classe" name="classe" placeholder="Votre classe (ex: 1er A1)" required autocomplete="off">
                </div>

                <div class="champ-saisie">
                    <label for="motDePasse" class="masque-visuellement">Votre mot de passe</label>
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="motDePasse" name="password" placeholder="Votre mot de passe (6 caractères min.)" required
                        autocomplete="new-password" minlength="6">
                </div>

                <div class="champ-saisie">
                    <label for="confirmationMotDePasse" class="masque-visuellement">Confirmez votre mot de passe</label>
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="confirmationMotDePasse" name="confirmationMotDePasse"
                        placeholder="Confirmez votre mot de passe" required autocomplete="new-password" minlength="6">
                </div>

                <!-- Zone de message dynamique (erreur ou succès) -->
                <p id="messageInscription" role="alert" hidden
                    style="font-size:13px; text-align:center; margin-bottom:12px;"></p>

                <button type="submit" class="bouton-valider">Créer mon compte</button>

                <p style="text-align:center; margin-top:16px; font-size:0.85rem;">
                    Déjà inscrit ? <a href="/html/index.html" style="color:var(--primaire); font-weight:700;">Se connecter</a>
                </p>

                <p style="text-align:center; margin-top:8px; font-size:0.85rem;">
                    <a href="/html/accueil.html" style="color:var(--texte-attenue); font-weight:600;">&larr; Retour à l'accueil</a>
                </p>

            </form>

        </section>

    </main>

    <script type="module" src="../js/register.js"></script>

</body>

</html>
