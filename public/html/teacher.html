<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard Professeur — SCHOOL MANAGEMENT</title>

    <!-- FontAwesome pour les icônes néon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/teacher.css">

</head>

<body class="corps-role">

    <header class="entete-role entete-role--professeur">
        <div class="marque-role">
            <i class="fa-solid fa-graduation-cap"></i>
            <span>SCHOOL MANAGEMENT</span>
        </div>

        <div class="profil-utilisateur">
            <i class="fa-solid fa-chalkboard-user"></i>
            <span id="nomProfesseur" class="nom-utilisateur">Professeur</span>
            <button id="deconnexion" class="bouton-deconnexion">
                <i class="fa-solid fa-power-off"></i> Déconnexion
            </button>
        </div>
    </header>

    <main class="conteneur-role">

        <!-- Informations professeur -->
        <section class="info-professeur">
            <h2><i class="fa-solid fa-hand-sparkles"></i> Bienvenue <span id="nomProfesseurCarte">Professeur</span></h2>
            <p>Utilisez le menu ci-dessous pour consulter vos élèves, gérer les notes et les absences.</p>
        </section>

        <!-- Actions professeur : chaque bouton porte un data-panel utilisé par teacher.js -->
        <section class="menu-professeur">
            <h2>Gestion pédagogique</h2>
            <div class="puces-menu">
                <button data-panel="eleves"><i class="fa-solid fa-user-graduate"></i> Voir les élèves</button>
                <button data-panel="notes"><i class="fa-solid fa-file-pen"></i> Gérer les notes</button>
                <button data-panel="absences"><i class="fa-solid fa-user-clock"></i> Gérer les absences</button>
            </div>
        </section>

        <!-- CONTENU DYNAMIQUE : rempli par le panneau sélectionné -->
        <section class="panneau" id="contenu">
            <div class="etat-vide">Choisissez une action ci-dessus pour commencer.</div>
        </section>

    </main>

    <script type="module" src="../js/teacher.js"></script>

</body>

</html>
