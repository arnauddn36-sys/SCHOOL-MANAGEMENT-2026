<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard Élève — SCHOOL MANAGEMENT</title>

    <!-- FontAwesome pour les icônes néon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/student.css">

</head>

<body class="corps-role">

    <header class="entete-role entete-role--eleve">
        <div class="marque-role">
            <i class="fa-solid fa-graduation-cap"></i>
            <span>SCHOOL MANAGEMENT</span>
        </div>

        <div class="profil-utilisateur">
            <i class="fa-solid fa-user-graduate"></i>
            <span id="nomEleve" class="nom-utilisateur">Élève</span>
            <button id="deconnexion" class="bouton-deconnexion">
                <i class="fa-solid fa-power-off"></i> Déconnexion
            </button>
        </div>
    </header>

    <main class="conteneur-role">

        <!-- Fiche d'identité de l'élève -->
        <section class="identite-eleve">

            <h2><i class="fa-solid fa-hand-sparkles"></i> Bonjour <span id="nomEleveCarte">Élève</span></h2>

            <div class="grille-identite">

                <div>
                    <span class="etiquette-info">Nom</span>
                    <span class="valeur-info" id="infoNom">---</span>
                </div>

                <div>
                    <span class="etiquette-info">Prénom</span>
                    <span class="valeur-info" id="infoPrenom">---</span>
                </div>

                <div>
                    <span class="etiquette-info">Classe</span>
                    <span class="valeur-info" id="infoClasse">---</span>
                </div>

                <div>
                    <span class="etiquette-info">Matricule</span>
                    <span class="valeur-info" id="infoMatricule">---</span>
                </div>

            </div>

        </section>

        <!-- Tableau des notes -->
        <section class="carte-notes">

            <h2><i class="fa-solid fa-file-pen"></i> Mes notes</h2>

            <table>
                <thead>
                    <tr>
                        <th>Matière</th>
                        <th>Note</th>
                    </tr>
                </thead>
                <tbody id="corpsNotes">
                    <tr><td colspan="2">Chargement...</td></tr>
                </tbody>
            </table>

        </section>

        <!-- Tableau des absences -->
        <section class="carte-absences">

            <h2><i class="fa-solid fa-user-clock"></i> Mes absences</h2>

            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Statut</th>
                    </tr>
                </thead>
                <tbody id="corpsAbsences">
                    <tr><td colspan="2">Chargement...</td></tr>
                </tbody>
            </table>

        </section>

    </main>

    <script type="module" src="../js/student.js"></script>

</body>

</html>
