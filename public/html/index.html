<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — School Management</title>

    <!-- FontAwesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body class="enveloppe-connexion">

    <main class="conteneur-connexion">

        <!-- EN-TÊTE AU-DESSUS DE LA CARTE DE CONNEXION -->
        <header class="en-tete-accueil">
            <h1 class="titre-accueil">BIENVENUE DANS VOTRE ESPACE DE GESTION SCOLAIRE</h1>
            <p class="sous-titre-accueil">Une solution simple pour administrer votre établissement scolaire.</p>

            <div class="etiquettes-accueil">
                <span class="etiquette"><i class="fa-solid fa-user-shield"></i> Administration</span>
                <span class="puce-etiquette">•</span>
                <span class="etiquette"><i class="fa-solid fa-chalkboard-user"></i> Enseignants</span>
                <span class="puce-etiquette">•</span>
                <span class="etiquette"><i class="fa-solid fa-graduation-cap"></i> Élèves</span>
                <span class="puce-etiquette">•</span>
                <span class="etiquette"><i class="fa-solid fa-file-pen"></i> Notes</span>
                <span class="puce-etiquette">•</span>
                <span class="etiquette"><i class="fa-solid fa-chart-line"></i> Statistiques</span>
            </div>
        </header>

        <!-- CARTE DE CONNEXION NÉON -->
        <section class="carte-connexion">

            <div class="avatar-utilisateur">
                <i class="fa-solid fa-user-shield"></i>
            </div>

            <div class="en-tete-marque">
                <h1>SCHOOL MANAGEMENT</h1>
                <h2>Se connecter à votre espace</h2>
            </div>

            <form id="formulaireConnexion" class="formulaire-neon" autocomplete="off">

                <div class="champ-saisie">
                    <label for="nom" class="masque-visuellement">Votre nom</label>
                    <i class="fa-regular fa-id-card"></i>
                    <input type="text" id="nom" name="nom" placeholder="Votre nom" required autocomplete="off">
                </div>

                <div class="champ-saisie">
                    <label for="prenom" class="masque-visuellement">Votre prénom</label>
                    <i class="fa-regular fa-user"></i>
                    <input type="text" id="prenom" name="prenom" placeholder="Votre prénom" required autocomplete="off">
                </div>

                <div class="champ-saisie">
                    <label for="email" class="masque-visuellement">Votre email</label>
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" id="email" name="email" placeholder="Votre email" required autocomplete="email">
                </div>

                <div class="champ-saisie">
                    <label for="motDePasse" class="masque-visuellement">Votre mot de passe</label>
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="motDePasse" name="password" placeholder="Votre mot de passe" required
                        autocomplete="new-password">
                </div>

                <!-- Zone d'erreur dynamique -->
                <p id="erreurConnexion" role="alert" hidden
                    style="color:#ff5252; font-size:13px; text-align:center; margin-bottom:12px;"></p>

                <button type="submit" class="bouton-valider">Se connecter</button>

            </form>

        </section>

    </main>

    <script type="module" src="../js/login.js"></script>

</body>

</html>
